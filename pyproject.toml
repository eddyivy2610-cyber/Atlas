[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umldoc"
version = "0.1.0"
description = "Drift-aware, verified UML documentation generator and analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "typing-extensions>=4.10.0",
]

[project.scripts]
umldoc = "umldoc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pylint>=3.1.0",
    "pydoctrace>=0.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/umldoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
